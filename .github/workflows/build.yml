name: Build
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Unzip source
        run: unzip -o caneisland.zip -d build
      - name: Build
        run: mvn -B package
        working-directory: build
      - uses: actions/upload-artifact@v4
        with:
          name: CaneIslands
          path: build/target/CaneIslands.jar
